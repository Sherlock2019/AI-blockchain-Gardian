name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx hardhat test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - name: Install
        run: |
          pip install -r backend/requirements-dev.txt
          npm ci --no-audit --no-fund --prefix blockchain
      - name: Lint
        run: ruff check backend
      - name: Start local chain and deploy the contract
        run: |
          (cd blockchain && npx hardhat node --hostname 127.0.0.1 > ../chain.log 2>&1 &)
          scripts/wait-for-rpc.sh http://127.0.0.1:8545
          (cd blockchain && npx hardhat run scripts/deploy.js --network localhost)
      - name: Test (unit, integration, and backend-to-contract)
        working-directory: backend
        # -rs lists skipped tests; the chain tests must not be among them here.
        run: |
          python -m pytest -q -rs | tee pytest.log
          ! grep -q "SKIPPED" pytest.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
